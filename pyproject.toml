[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-releases"
version = "0.1.0"
description = "Helix release build and publication CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hr = "helix_releases.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
